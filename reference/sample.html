<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MEP — Machine Execution Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f0eeea;
        --s: #fff;
        --s2: #f7f6f4;
        --s3: #efede9;
        --b1: rgba(0, 0, 0, 0.07);
        --b2: rgba(0, 0, 0, 0.13);
        --b3: rgba(0, 0, 0, 0.22);
        --t1: #18170f;
        --t2: #5a5950;
        --t3: #9c9b95;
        --blu: #1a5fb4;
        --blu-l: #deeaf8;
        --blu-t: #1a5fb4;
        --grn: #207a55;
        --grn-l: #ddf0e5;
        --grn-t: #207a55;
        --amb: #c47d0a;
        --amb-l: #fef0d0;
        --amb-t: #c47d0a;
        --red: #c0392b;
        --red-l: #fde8e6;
        --red-t: #c0392b;
        --pur: #5e4db2;
        --pur-l: #ede9fb;
        --pur-t: #5e4db2;
        --tel: #0b7285;
        --tel-l: #d8f5f8;
        --tel-t: #0b7285;
        --cor: #9c3b23;
        --cor-l: #fbeadf;
        --cor-t: #9c3b23;
        --nav-h: 60px;
        --hdr-h: 54px;
        --sb-w: 220px;
        --safe: env(safe-area-inset-bottom, 0px);
        --ff: 'DM Sans', system-ui, sans-serif;
        --fm: 'DM Mono', monospace;
        --r: 10px;
        --rs: 6px;
        --rp: 99px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        font-family: var(--ff);
        font-size: 14px;
        color: var(--t1);
      }

      /* ── SHELL ── */
      #shell {
        display: flex;
        height: 100dvh;
        overflow: hidden;
      }

      /* sidebar (desktop) */
      #sidebar {
        width: var(--sb-w);
        flex-shrink: 0;
        background: var(--s);
        border-right: 0.5px solid var(--b1);
        display: none;
        flex-direction: column;
      }
      #sidebar .sb-brand {
        padding: 18px 16px 14px;
        border-bottom: 0.5px solid var(--b1);
      }
      #sidebar .logo {
        width: 30px;
        height: 30px;
        background: var(--blu);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #sidebar .sb-title {
        font-size: 15px;
        font-weight: 600;
        margin-top: 8px;
        letter-spacing: -0.3px;
      }
      #sidebar .sb-sub {
        font-size: 11px;
        color: var(--t3);
        margin-top: 1px;
      }
      .sb-section {
        font-size: 10px;
        font-weight: 600;
        color: var(--t3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 16px 16px 6px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
        margin: 1px 6px;
        border-radius: var(--rs);
        cursor: pointer;
        color: var(--t2);
        font-size: 13px;
        font-weight: 500;
        border: none;
        background: none;
        width: calc(100% - 12px);
        text-align: left;
      }
      .sb-item:hover {
        background: var(--s2);
      }
      .sb-item.on {
        background: var(--blu-l);
        color: var(--blu-t);
      }
      .sb-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--red);
        margin-left: auto;
      }
      .sb-footer {
        margin-top: auto;
        padding: 12px 16px;
        border-top: 0.5px solid var(--b1);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sb-user {
        font-size: 12px;
        font-weight: 500;
      }
      .sb-role {
        font-size: 10px;
        color: var(--t3);
      }

      /* main area */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }

      /* header */
      .hdr {
        height: var(--hdr-h);
        background: var(--s);
        border-bottom: 0.5px solid var(--b1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        flex-shrink: 0;
      }
      .hdr-l {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mob-logo {
        width: 28px;
        height: 28px;
        background: var(--blu);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .hdr-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .hdr-sub {
        font-size: 11px;
        color: var(--t3);
        margin-top: 1px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--s2);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--t2);
        flex-shrink: 0;
        transition: background 0.12s;
      }
      .icon-btn:hover {
        background: var(--s3);
      }
      .hdr-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* scroll */
      .scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        background: var(--bg);
      }

      /* bottom nav (mobile/tablet) */
      .bnav {
        height: var(--nav-h);
        background: var(--s);
        border-top: 0.5px solid var(--b1);
        display: flex;
        align-items: stretch;
        padding-bottom: var(--safe);
        flex-shrink: 0;
      }
      .ni {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: pointer;
        border: none;
        background: none;
        color: var(--t3);
        transition: color 0.15s;
        position: relative;
        padding-bottom: 2px;
      }
      .ni.on {
        color: var(--blu);
      }
      .ni-lbl {
        font-size: 10px;
        font-weight: 500;
      }
      .ni-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--red);
        position: absolute;
        top: 7px;
        right: calc(50% - 14px);
      }

      /* ── RESPONSIVE ── */
      @media (min-width: 768px) {
        .bnav {
          display: none;
        }
        #sidebar {
          display: flex;
        }
      }
      @media (min-width: 768px) and (max-width: 1023px) {
        #sidebar {
          width: 60px;
        }
        .sb-item span,
        .sb-section,
        .sb-title,
        .sb-sub,
        .sb-dot,
        .sb-user,
        .sb-role {
          display: none;
        }
        .sb-item {
          justify-content: center;
          padding: 10px;
          margin: 2px 6px;
          width: calc(100% - 12px);
        }
        #sidebar .sb-brand {
          padding: 14px;
          display: flex;
          justify-content: center;
        }
        .sb-footer {
          justify-content: center;
          padding: 12px 6px;
        }
      }
      @media (min-width: 1280px) {
        .kgrid {
          grid-template-columns: repeat(4, 1fr) !important;
        }
        .card-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* ── VIEWS ── */
      .view {
        display: none;
      }
      .view.on {
        display: block;
      }

      /* ── SECTION LABEL ── */
      .slbl {
        font-size: 10px;
        font-weight: 600;
        color: var(--t3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 16px 16px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .slbl-btn {
        font-size: 12px;
        font-weight: 500;
        color: var(--blu);
        background: none;
        border: none;
        cursor: pointer;
        text-transform: none;
        letter-spacing: 0;
      }

      /* ── KPI ── */
      .kgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 16px 16px 4px;
      }
      @media (min-width: 640px) {
        .kgrid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .kpi {
        background: var(--s);
        border-radius: var(--r);
        padding: 14px;
      }
      .kpi-l {
        font-size: 11px;
        color: var(--t2);
        margin-bottom: 5px;
      }
      .kpi-v {
        font-size: 28px;
        font-weight: 600;
        font-family: var(--fm);
        line-height: 1;
      }
      .kpi-s {
        font-size: 10px;
        color: var(--t3);
        margin-top: 3px;
      }

      /* ── CARD ── */
      .card {
        background: var(--s);
        border-radius: var(--r);
        margin: 0 16px;
        overflow: hidden;
      }
      .card + .card {
        margin-top: 10px;
      }
      .card-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 0 16px;
      }
      @media (min-width: 640px) {
        .card-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* ── LIST ITEM ── */
      .li {
        padding: 13px 16px;
        border-bottom: 0.5px solid var(--b1);
        cursor: pointer;
        transition: background 0.1s;
      }
      .li:active,
      .li:hover {
        background: var(--s2);
      }
      .li:last-child {
        border-bottom: none;
      }
      .li-r {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
      }
      .li-r:last-child {
        margin-bottom: 0;
      }
      .li-title {
        font-size: 14px;
        font-weight: 500;
      }
      .li-sub {
        font-size: 12px;
        color: var(--t2);
      }
      .li-meta {
        font-size: 11px;
        color: var(--t3);
      }

      /* ── BADGES ── */
      .bx {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: var(--rp);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
      }
      .b-blu {
        background: var(--blu-l);
        color: var(--blu-t);
      }
      .b-grn {
        background: var(--grn-l);
        color: var(--grn-t);
      }
      .b-amb {
        background: var(--amb-l);
        color: var(--amb-t);
      }
      .b-red {
        background: var(--red-l);
        color: var(--red-t);
      }
      .b-pur {
        background: var(--pur-l);
        color: var(--pur-t);
      }
      .b-tel {
        background: var(--tel-l);
        color: var(--tel-t);
      }
      .b-cor {
        background: var(--cor-l);
        color: var(--cor-t);
      }
      .b-gray {
        background: var(--s3);
        color: var(--t2);
      }

      /* ── PROGRESS ── */
      .prog {
        height: 4px;
        background: var(--s3);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 7px;
      }
      .pf {
        height: 100%;
        border-radius: 2px;
        transition: width 0.3s;
      }
      .pg {
        background: var(--grn);
      }
      .pa {
        background: var(--amb);
      }
      .pr {
        background: var(--red);
      }

      /* ── AVATARS ── */
      .av {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .av-sm {
        width: 22px;
        height: 22px;
        font-size: 9px;
      }
      .av-lg {
        width: 36px;
        height: 36px;
        font-size: 12px;
      }
      .av0 {
        background: var(--blu-l);
        color: var(--blu-t);
      }
      .av1 {
        background: var(--grn-l);
        color: var(--grn-t);
      }
      .av2 {
        background: var(--amb-l);
        color: var(--amb-t);
      }
      .av3 {
        background: var(--pur-l);
        color: var(--pur-t);
      }
      .av4 {
        background: var(--cor-l);
        color: var(--cor-t);
      }
      .av5 {
        background: var(--tel-l);
        color: var(--tel-t);
      }

      /* ── ALERT ── */
      .alert {
        border-radius: var(--rs);
        padding: 12px;
        margin: 0 16px;
      }
      .alert + .alert {
        margin-top: 8px;
      }
      .alert-r {
        background: var(--red-l);
        border-left: 3px solid var(--red);
      }
      .alert-a {
        background: var(--amb-l);
        border-left: 3px solid var(--amb);
      }
      .alert-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--red-t);
      }
      .alert-a .alert-title {
        color: var(--amb-t);
      }
      .alert-body {
        font-size: 11px;
        color: #8b2a1e;
        margin-top: 3px;
        line-height: 1.5;
      }
      .alert-a .alert-body {
        color: var(--amb-t);
      }

      /* ── STAGE TRACK ── */
      .stages {
        display: flex;
        padding: 10px 16px;
        gap: 0;
        overflow-x: auto;
        scrollbar-width: none;
        background: var(--s);
        border-bottom: 0.5px solid var(--b1);
      }
      .stages::-webkit-scrollbar {
        display: none;
      }
      .stg {
        padding: 4px 10px;
        border-radius: var(--rp);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .stg-d {
        background: var(--grn-l);
        color: var(--grn-t);
      }
      .stg-n {
        background: var(--blu);
        color: #fff;
      }
      .stg-t {
        background: var(--bg);
        color: var(--t3);
      }
      .stg-ln {
        width: 10px;
        height: 1.5px;
        align-self: center;
        flex-shrink: 0;
      }
      .stg-ld {
        background: var(--grn);
      }
      .stg-lt {
        background: var(--b2);
      }

      /* ── TABS ── */
      .tabs {
        display: flex;
        padding: 0 16px;
        border-bottom: 0.5px solid var(--b1);
        background: var(--s);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        padding: 10px 12px;
        font-size: 13px;
        color: var(--t3);
        cursor: pointer;
        border: none;
        background: none;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
        margin-bottom: -0.5px;
        flex-shrink: 0;
        font-family: var(--ff);
        font-weight: 500;
      }
      .tab.on {
        color: var(--blu);
        border-bottom-color: var(--blu);
      }

      /* ── CHIPS ── */
      .chips {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        padding: 6px 13px;
        border-radius: var(--rp);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        background: var(--s);
        border: 1.5px solid var(--b2);
        color: var(--t2);
        transition: all 0.12s;
      }
      .chip.on {
        background: var(--blu);
        color: #fff;
        border-color: var(--blu);
      }

      /* ── TREE ── */
      .tn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 16px;
        border-bottom: 0.5px solid var(--b1);
        background: var(--s);
        cursor: pointer;
        transition: background 0.1s;
      }
      .tn:hover,
      .tn:active {
        background: var(--s2);
      }
      .tn.blk {
        background: var(--red-l);
      }
      .tn-lbl {
        flex: 1;
        font-size: 13px;
      }
      .tn-meta {
        font-size: 11px;
        color: var(--t3);
      }
      .caret {
        font-size: 10px;
        color: var(--t3);
        width: 12px;
        text-align: center;
        flex-shrink: 0;
      }
      .add-c {
        font-size: 11px;
        color: var(--blu);
        padding: 2px 8px;
        border-radius: var(--rp);
        border: 1px solid var(--blu);
        background: none;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        font-family: var(--ff);
      }
      .add-c:hover {
        background: var(--blu-l);
      }

      /* ── FAB ── */
      .fab {
        position: fixed;
        bottom: calc(var(--nav-h) + 14px + var(--safe));
        right: 20px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--blu);
        color: #fff;
        border: none;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(26, 95, 180, 0.38);
        z-index: 30;
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .fab:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 24px rgba(26, 95, 180, 0.46);
      }
      .fab:active {
        transform: scale(0.95);
      }
      @media (min-width: 768px) {
        .fab {
          bottom: 20px;
          right: 24px;
        }
      }

      /* ── SHEET ── */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        z-index: 40;
        display: none;
        transition: background 0.25s;
      }
      .backdrop.on {
        display: block;
        background: rgba(0, 0, 0, 0.42);
      }
      .sheet {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%) translateY(100%);
        width: 100%;
        max-width: 560px;
        background: var(--s);
        border-radius: 20px 20px 0 0;
        z-index: 50;
        transition: transform 0.28s cubic-bezier(0.32, 0, 0.67, 0);
        max-height: 90dvh;
        display: flex;
        flex-direction: column;
      }
      .sheet.on {
        transform: translateX(-50%) translateY(0);
      }
      @media (min-width: 768px) {
        .sheet {
          border-radius: 16px;
          bottom: auto;
          top: 50%;
          transform: translateX(-50%) translateY(-50%) scale(0.96);
          max-height: 80dvh;
          box-shadow: 0 16px 60px rgba(0, 0, 0, 0.25);
        }
        .sheet.on {
          transform: translateX(-50%) translateY(-50%) scale(1);
        }
        .sheet-handle {
          display: none !important;
        }
      }
      .sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--b2);
        margin: 10px auto 0;
        flex-shrink: 0;
      }
      .sh-hdr {
        padding: 14px 20px 12px;
        border-bottom: 0.5px solid var(--b1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .sh-title {
        font-size: 16px;
        font-weight: 600;
      }
      .sh-body {
        padding: 16px 20px;
        overflow-y: auto;
        flex: 1;
      }
      .sh-foot {
        padding: 12px 20px calc(12px + var(--safe));
        border-top: 0.5px solid var(--b1);
        flex-shrink: 0;
      }
      @media (min-width: 768px) {
        .sh-foot {
          padding-bottom: 16px;
        }
      }

      /* ── FORM ── */
      .field {
        margin-bottom: 15px;
      }
      .fl {
        font-size: 12px;
        font-weight: 500;
        color: var(--t2);
        margin-bottom: 5px;
        display: block;
      }
      .field input,
      .field textarea,
      .field select {
        width: 100%;
        padding: 10px 12px;
        border-radius: var(--rs);
        border: 1.5px solid var(--b2);
        background: var(--s2);
        font-size: 14px;
        font-family: var(--ff);
        color: var(--t1);
        outline: none;
        transition: border-color 0.15s;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: var(--blu);
        background: var(--s);
      }
      .field textarea {
        resize: none;
        min-height: 72px;
        line-height: 1.5;
      }
      .field select {
        appearance: none;
        background-image: url("data:image/svg+xml,%3Csvg width='10' height='7' viewBox='0 0 10 7' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239c9b95' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");

      // ═══════════════════════════════════════════════
      //  STATE
      // ═══════════════════════════════════════════════
      let S;
      function initState() {
        try {
          const saved = localStorage.getItem('mep3_s');
          if (saved) {
            S = JSON.parse(saved);
            return;
          }
        } catch (e) {}
        S = JSON.parse(JSON.stringify(SEED));
      }
      function save() {
        try {
          localStorage.setItem('mep3_s', JSON.stringify(S));
        } catch (e) {}
      }
      function resetToSeed() {
        if (confirm('Reset to demo data? All your changes will be lost.')) {
          localStorage.removeItem('mep3_s');
          initState();
          renderAll();
        }
      }

      initState();

      let UI = { view: 'overview', prev: null, oppDetId: null, projDetId: null, projTab: 'overview', taskFilter: 'All', procFilter: 'All' };

      // ═══════════════════════════════════════════════
      //  NAVIGATION
      // ═══════════════════════════════════════════════
      const ALL_VIEWS = ['overview', 'opps', 'oppdet', 'projects', 'projdet', 'tasks', 'proc'];
      const NAV_IDS = ['overview', 'opps', 'projects', 'tasks', 'proc'];

      function goView(v, opts = {}) {
        UI.prev = UI.view;
        UI.view = v;
        ALL_VIEWS.forEach((id) => {
          document.getElementById('V_' + id).classList.toggle('on', id === v);
        });
        NAV_IDS.forEach((n) => {
          const mob = document.getElementById('N_' + n);
          const sb = document.getElementById('SB_' + n);
          const active = n === v || (v === 'oppdet' && n === 'opps') || (v === 'projdet' && n === 'projects');
          if (mob) mob.classList.toggle('on', active);
          if (sb) sb.classList.toggle('on', active);
        });
        if (opts.oppId !== undefined) UI.oppDetId = opts.oppId;
        if (opts.projId !== undefined) {
          UI.projDetId = opts.projId;
          UI.projTab = opts.tab || 'overview';
        }
        document.getElementById('G_scroll').scrollTop = 0;
        renderAll();
        updateFab();
      }

      function hdrAction() {
        if (UI.view === 'oppdet') goView('opps');
        else if (UI.view === 'projdet') goView('projects');
        else openSheet('Settings', `<div style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:16px;">MEP — Machine Execution Platform<br>All data stored locally in your browser.</div><button class="btn btn-d" onclick="resetToSeed();closeSheet()">Reset to Demo Data</button>`, `<div class="btn-row"><button class="btn btn-p" onclick="closeSheet()">Close</button></div>`);
      }

      // ═══════════════════════════════════════════════
      //  HELPERS
      // ═══════════════════════════════════════════════
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      }
      function avCls(name) {
        const h = [...String(name || '')].reduce((a, c) => a + c.charCodeAt(0), 0);
        return AVC[h % AVC.length];
      }
      function ini(name) {
        return (name || '?')
          .split(' ')
          .map((w) => w[0])
          .join('')
          .slice(0, 2)
          .toUpperCase();
      }
      function av(name, sz = '') {
        return `<div class="av ${avCls(name)} ${sz}">${ini(name)}</div>`;
      }
      function bx(t, c) {
        return `<span class="bx ${c}">${t}</span>`;
      }
      function oppBadge(s) {
        return bx(s, { New: 'b-pur', Feasibility: 'b-amb', Approved: 'b-blu', Converted: 'b-tel' }[s] || 'b-gray');
      }
      function taskBadge(s) {
        return bx(s, { 'Not Started': 'b-gray', 'In Progress': 'b-blu', 'Under Review': 'b-pur', Blocked: 'b-red', Completed: 'b-tel' }[s] || 'b-gray');
      }
      function prioBadge(p) {
        return bx(p, { Low: 'b-gray', Medium: 'b-amb', High: 'b-cor', Critical: 'b-red' }[p] || 'b-gray');
      }
      function healthBadge(h) {
        return bx(h, { Healthy: 'b-grn', Watch: 'b-amb', 'At Risk': 'b-cor' }[h] || 'b-gray');
      }
      function stageBadge(s) {
        return bx(s, 'b-pur');
      }
      function procBadge(s) {
        return bx(s, { 'Not Ready': 'b-red', 'Pending Release': 'b-amb', Ready: 'b-grn', Ordered: 'b-blu', Received: 'b-tel' }[s] || 'b-gray');
      }
      function riskBadge(r) {
        return bx(r, { Low: 'b-gray', Medium: 'b-amb', High: 'b-cor', Critical: 'b-red' }[r] || 'b-gray');
      }
      function nodeBadge(t) {
        return bx(t, { Machine: 'b-blu', Module: 'b-pur', Subassembly: 'b-gray' }[t] || 'b-gray');
      }
      function progCls(h) {
        return h === 'Healthy' ? 'pg' : h === 'Watch' ? 'pa' : 'pr';
      }
      function projPct(p) {
        const t = (p.tasks || []).length;
        if (!t) return 0;
        return Math.round(((p.tasks || []).filter((x) => x.status === 'Completed').length / t) * 100);
      }
      function fmtDate(d) {
        if (!d) return '';
        try {
          return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' });
        } catch {
          return d;
        }
      }

      // ═══════════════════════════════════════════════
      //  RENDER HEADER
      // ═══════════════════════════════════════════════
      function renderHeader() {
        const isDetail = UI.view === 'oppdet' || UI.view === 'projdet';
        const titles = { overview: 'Dashboard', opps: 'Pipeline', oppdet: 'Opportunity', projects: 'Projects', projdet: 'Project', tasks: 'All Tasks', proc: 'Procurement' };
        document.getElementById('G_title').textContent = titles[UI.view] || 'MEP';
        let sub = '';
        if (UI.view === 'overview') sub = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        else if (UI.view === 'opps') sub = `${S.opps.length} requests`;
        else if (UI.view === 'oppdet') {
          const o = S.opps.find((x) => x.id === UI.oppDetId);
          sub = o ? o.customer : '';
        } else if (UI.view === 'projects') sub = `${S.projects.length} active`;
        else if (UI.view === 'projdet') {
          const p = S.projects.find((x) => x.id === UI.projDetId);
          sub = p ? `${p.customer} · ${p.health || 'Healthy'}` : '';
          document.getElementById('G_title').textContent = p ? p.title : 'Project';
        } else if (UI.view === 'tasks') {
          const bl = S.projects.flatMap((p) => (p.tasks || []).filter((t) => t.status === 'Blocked'));
          sub = `${S.projects.flatMap((p) => p.tasks || []).length} tasks · ${bl.length} blocked`;
        } else if (UI.view === 'proc') sub = `Cross-project`;
        document.getElementById('G_sub').textContent = sub;
        document.getElementById('MOB_LOGO').style.display = isDetail ? 'none' : 'flex';
        document.getElementById('G_hdrBtn').innerHTML = isDetail
          ? `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9H3M8 4l-5 5 5 5"/></svg>`
          : `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="5.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"/><circle cx="9" cy="12.5" r="1.5" fill="currentColor" stroke="none"/></svg>`;
      }

      function updateTaskDot() {
        const has = S.projects.flatMap((p) => (p.tasks || []).filter((t) => t.status === 'Blocked')).length > 0;
        ['N_taskDot', 'SB_taskDot'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.style.display = has ? '' : 'none';
        });
      }

      // ═══════════════════════════════════════════════
      //  FAB
      // ═══════════════════════════════════════════════
      const FAB_MAP = { opps: () => openOppForm(), projects: null, overview: null, tasks: null, proc: null, oppdet: null, projdet: null };
      let fabFn = null;
      function updateFab() {
        const f = document.getElementById('G_fab');
        fabFn = FAB_MAP[UI.view] || null;
        // Also show in projdet based on tab
        if (UI.view === 'projdet') {
          const p = S.projects.find((x) => x.id === UI.projDetId);
          if (p) {
            if (UI.projTab === 'mbs') fabFn = () => openNodeForm(p.id, null, 'Machine');
            else if (UI.projTab === 'procurement') fabFn = () => openProcForm(p.id);
            else if (UI.projTab === 'decisions') fabFn = () => openDecForm(p.id);
            else if (UI.projTab === 'tasks')
              fabFn = () => {
                /* handled inline */
              };
          }
        }
        f.style.display = fabFn ? 'flex' : 'none';
      }
      function fabAction() {
        if (fabFn) fabFn();
      }

      // ═══════════════════════════════════════════════
      //  OVERVIEW
      // ═══════════════════════════════════════════════
      function renderOverview() {
        const el = document.getElementById('R_overview');
        const blocked = S.projects.flatMap((p) => (p.tasks || []).filter((t) => t.status === 'Blocked'));
        const overdue = S.projects.flatMap((p) => (p.tasks || []).filter((t) => t.due && new Date(t.due) < new Date() && t.status !== 'Completed'));
        const llRisk = S.projects.flatMap((p) => (p.procurement || []).filter((x) => x.leadWeeks >= 12 && x.status !== 'Ordered' && x.status !== 'Received'));

        let h = `<div class="kgrid">
    <div class="kpi"><div class="kpi-l">Active Projects</div><div class="kpi-v">${S.projects.length}</div><div class="kpi-s">${S.projects.filter((p) => p.health === 'Healthy').length} healthy</div></div>
    <div class="kpi"><div class="kpi-l">Overdue Tasks</div><div class="kpi-v" style="color:var(--red-t)">${overdue.length}</div><div class="kpi-s">${overdue.length ? '+' + overdue.length + ' this week' : 'All on time'}</div></div>
    <div class="kpi"><div class="kpi-l">Active Blockers</div><div class="kpi-v" style="color:var(--amb-t)">${blocked.length}</div><div class="kpi-s">${blocked.filter((t) => t.priority === 'Critical').length} critical</div></div>
    <div class="kpi"><div class="kpi-l">Long-Lead Risk</div><div class="kpi-v" style="color:var(--cor-t)">${llRisk.length}</div><div class="kpi-s">≥12 wks unordered</div></div>
  </div>`;

        if (S.projects.length) {
          h += `<div class="slbl"><span>PROJECT HEALTH</span></div>`;
          // Desktop: show as grid
          h += `<div class="card-grid">`;
          S.projects.forEach((p) => {
            const pct = projPct(p);
            const bl = (p.tasks || []).filter((t) => t.status === 'Blocked').length;
            h += `<div class="card" style="margin:0;" onclick="openProj(${p.id})">
        <div class="li" style="cursor:pointer;">
          <div class="li-r"><div class="li-title">${p.title}</div>${healthBadge(p.health || 'Healthy')}</div>
          <div class="li-r"><span class="li-meta mono">${p.customer}</span>${stageBadge(p.stage || 'Intake')}</div>
          <div class="prog"><div class="pf ${progCls(p.health || 'Healthy')}" style="width:${pct}%"></div></div>
          <div class="li-r" style="margin-top:5px;">
            <span class="li-meta">${pct}% complete · ${p.pm || '—'} · ${fmtDate(p.delivery) || '—'}</span>
            ${bl ? `<span style="font-size:11px;color:var(--red-t);font-weight:500;">${bl} blocked</span>` : ''}
          </div>
        </div>
      </div>`;
          });
          h += `</div>`;
        }

        if (blocked.length || overdue.length) {
          h += `<div class="slbl"><span>OVERDUE & BLOCKED</span></div>`;
          [...blocked, ...overdue.filter((t) => !blocked.find((b) => b.id === t.id))].slice(0, 4).forEach((t) => {
            const proj = S.projects.find((p) => (p.tasks || []).find((x) => x.id === t.id));
            const isBlocked = t.status === 'Blocked';
            h += `<div class="${isBlocked ? 'alert alert-r' : 'alert alert-a'}" style="margin-bottom:8px;" onclick="goView('tasks')">
        <div class="alert-title">${t.title}</div>
        <div class="alert-body">${proj ? proj.title : ''} · ${t.owner || '—'}</div>
        <div style="display:flex;gap:6px;margin-top:8px;">${taskBadge(t.status)}${prioBadge(t.priority || 'Medium')}</div>
      </div>`;
          });
        }
        h += `<div class="sp"></div>`;
        el.innerHTML = h;
      }

      // ═══════════════════════════════════════════════
      //  OPPORTUNITIES
      // ═══════════════════════════════════════════════
      function renderOpps() {
        const el = document.getElementById('R_opps');
        if (!S.opps.length) {
          el.innerHTML = emptyState('Pipeline', 'No opportunities yet', 'Capture machine requests from sales. Each opportunity flows through feasibility → approval → project conversion.', '+ New Request', 'openOppForm()');
          return;
        }
        const groups = { New: [], Feasibility: [], Approved: [], Converted: [] };
        S.opps.forEach((o) => (groups[o.status] || []).push(o));
        let h = '';
        ['New', 'Feasibility', 'Approved', 'Converted'].forEach((g) => {
          if (!groups[g].length) return;
          h += `<div class="slbl"><span>${g.toUpperCase()}</span><button class="slbl-btn" onclick="openOppForm()">+</button></div><div class="card">`;
          groups[g].forEach((o) => {
            h += `<div class="li" onclick="goView('oppdet',{oppId:${o.id}})">
        <div class="li-r"><div class="li-title">${o.title}</div>${oppBadge(o.status)}</div>
        <div class="li-r"><span class="li-sub">${o.customer}</span><span class="li-meta">${o.machineType || ''} · ${o.axes || '?'} axes</span></div>

      </div>`;
          });
          h += `</div>`;

      // ═══════════════════════════════════════════════
      function renderProjects() {
        const el = document.getElementById('R_projects');
        if (!S.projects.length) {
          el.innerHTML = emptyState('Projects', 'No projects yet', 'Create an opportunity in Pipeline and convert it to a project.', 'Go to Pipeline →', 'goView("opps")');
          return;
        }
        let h = `<div class="slbl"><span>ACTIVE PROJECTS</span></div><div class="card-grid">`;
        S.projects.forEach((p) => {
          const pct = projPct(p);
          const bl = (p.tasks || []).filter((t) => t.status === 'Blocked').length;
          h += `<div class="card" style="margin:0;" onclick="openProj(${p.id})">
      <div class="li" style="cursor:pointer;">
        <div class="li-r"><div class="li-title">${p.title}</div>${healthBadge(p.health || 'Healthy')}</div>
        <div class="li-r"><span class="li-meta">${p.customer}</span>${stageBadge(p.stage || 'Intake')}</div>
        <div class="prog"><div class="pf ${progCls(p.health || 'Healthy')}" style="width:${pct}%"></div></div>
        <div class="li-r" style="margin-top:5px;"><span class="li-meta">${pct}% · ${p.pm || '—'} · ${fmtDate(p.delivery) || '—'}</span>${bl ? `<span style="font-size:11px;color:var(--red-t);font-weight:500;">${bl} blocked</span>` : ''}</div>
      </div>
    </div>`;
        });
        h += `</div><div class="sp"></div>`;
        el.innerHTML = h;
      }

      function openProj(id) {
        goView('projdet', { projId: id, tab: 'overview' });
      }

      // ═══════════════════════════════════════════════
      //  PROJECT DETAIL
      // ═══════════════════════════════════════════════
      function renderProjDet() {
        const el = document.getElementById('R_projdet');
        const p = S.projects.find((x) => x.id === UI.projDetId);
        if (!p) {
          el.innerHTML = '';
          return;
        }
        const si = STAGES.indexOf(p.stage || 'Intake');
        let stgH = `<div class="stages">`;
        STAGES.forEach((s, i) => {
          const cls = i < si ? 'stg-d' : i === si ? 'stg-n' : 'stg-t';
          stgH += `<div class="stg ${cls}">${s}${i < si ? ' ✓' : ''}</div>`;
          if (i < STAGES.length - 1) stgH += `<div class="stg-ln ${i < si ? 'stg-ld' : 'stg-lt'}"></div>`;
        });
        stgH += `</div>`;
        const tabLabels = ['Overview', 'MBS Tree', 'Tasks', 'Procurement', 'Decisions'];
        const tabKeys = ['overview', 'mbs', 'tasks', 'procurement', 'decisions'];
        let tabH = `<div class="tabs">`;
        tabKeys.forEach((k, i) => {
          tabH += `<button class="tab ${UI.projTab === k ? 'on' : ''}" onclick="setProjTab('${k}')">${tabLabels[i]}</button>`;
        });
        tabH += `</div>`;
        let content = '';
        if (UI.projTab === 'overview') content = renderPOv(p);
        else if (UI.projTab === 'mbs') content = renderMBS(p);
        else if (UI.projTab === 'tasks') content = renderPTasks(p);
        else if (UI.projTab === 'procurement') content = renderPProc(p);
        else if (UI.projTab === 'decisions') content = renderPDecs(p);
        el.innerHTML = stgH + tabH + content;
      }

      function setProjTab(t) {
        UI.projTab = t;
        renderProjDet();
        updateFab();
      }

      function renderPOv(p) {
        const bl = (p.tasks || []).filter((t) => t.status === 'Blocked');
        let h = `<div class="slbl"><span>PROJECT HEALTH</span></div>
  <div style="padding:0 16px 12px;"><div class="seg">`;
        HEALTH.forEach((hv) => {
          h += `<div class="so ${(p.health || 'Healthy') === hv ? 'on' : ''}" onclick="setHealth(${p.id},'${hv}')">${hv}</div>`;
        });
        h += `</div></div>`;
        h += `<div class="slbl"><span>DETAILS</span><button class="slbl-btn" onclick="openProjEdit(${p.id})">Edit</button></div>
  <div class="card"><div class="li" style="cursor:default;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div><div class="li-meta">Customer</div><div class="li-sub" style="font-weight:500;margin-top:2px;">${p.customer}</div></div>
      <div><div class="li-meta">Project Manager</div><div class="li-sub" style="font-weight:500;margin-top:2px;">${p.pm || '—'}</div></div>
      <div><div class="li-meta">Delivery Target</div><div class="li-sub" style="font-weight:500;margin-top:2px;">${p.delivery || '—'}</div></div>
      <div><div class="li-meta">Stage</div><div style="margin-top:2px;">${stageBadge(p.stage || 'Intake')}</div></div>
    </div>
  </div></div>`;
        // Stage advance
        const si = STAGES.indexOf(p.stage || 'Intake');
        if (si < STAGES.length - 1) {
          h += `<div style="padding:10px 16px;"><button style="width:100%;padding:11px;border-radius:var(--rs);background:var(--grn-l);color:var(--grn-t);border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--ff);" onclick="advanceStage(${p.id})">Advance to ${STAGES[si + 1]} →</button></div>`;
        }
        if (p.kickoffNotes) h += `<div class="slbl"><span>KICKOFF NOTES</span></div><div class="card"><div class="li" style="cursor:default;"><div class="li-meta" style="margin-bottom:5px;">${fmtDate(p.kickoffDate)}</div><div class="li-sub" style="line-height:1.65;">${p.kickoffNotes}</div></div></div>`;

        h += `<div class="slbl"><span>MILESTONES</span><button class="slbl-btn" onclick="openMilestoneForm(${p.id})">+ Add</button></div>`;
        if ((p.milestones || []).length) {
          h += `<div class="card">`;
          p.milestones.forEach((m, i) => {
            const done = m.status === 'Done';
            h += `<div class="li" onclick="toggleMilestone(${p.id},${i})">
        <div class="li-r">
          <div style="display:flex;align-items:center;gap:9px;">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="${done ? 'var(--grn)' : 'var(--b2)'}" stroke-width="1.5"/>${done ? '<path d="M5.5 9.5l2.5 2.5L13 6.5" stroke="var(--grn)" stroke-width="1.5" stroke-linecap="round"/>' : ''}</svg>
            <span class="li-sub" style="${done ? 'text-decoration:line-through;color:var(--t3);' : ''}">${m.title}</span>
          </div>
          <span class="mono" style="color:${done ? 'var(--t3)' : 'var(--t2)'};">${fmtDate(m.date)}</span>
        </div>
      </div>`;
          });
          h += `</div>`;
        } else {
          h += `<div class="card"><div class="li" style="cursor:default;text-align:center;"><div class="li-meta">No milestones. Add key dates like Design Release, Build Start.</div></div></div>`;
        }

        if (bl.length) {
          h += `<div class="slbl"><span>ACTIVE BLOCKERS</span></div>`;
          bl.forEach((t) => {
            h += `<div class="alert alert-r" style="margin-bottom:8px;">
        <div class="alert-title">${t.title}</div>
        <div class="alert-body">Owner: ${t.owner || '—'} · ${t.dept || '—'}</div>
        <div style="display:flex;gap:6px;margin-top:8px;">${prioBadge(t.priority || 'Medium')}</div>
      </div>`;
          });
        }

        h += `<div class="slbl"><span>DANGER ZONE</span></div>
  <div class="card"><div class="li" onclick="delProj(${p.id})"><div class="li-title" style="color:var(--red-t);">Delete Project</div></div></div><div class="sp"></div>`;
        return h;
      }

      function setHealth(pid, h) {
        const p = S.projects.find((x) => x.id === pid);
        if (p) {
          p.health = h;
          save();
          renderProjDet();
          renderAll();
        }
      }
      function advanceStage(pid) {
        const p = S.projects.find((x) => x.id === pid);
        if (!p) return;
        const si = STAGES.indexOf(p.stage || 'Intake');
        if (si < STAGES.length - 1) {
          p.stage = STAGES[si + 1];
          save();
          renderAll();
          renderProjDet();
        }
      }
      function toggleMilestone(pid, idx) {
        const p = S.projects.find((x) => x.id === pid);
        if (!p || !p.milestones[idx]) return;
        p.milestones[idx].status = p.milestones[idx].status === 'Done' ? 'Pending' : 'Done';
        save();
        renderProjDet();
      }

      // MBS TREE
      function renderMBS(p) {
        const nodes = p.nodes || [],
          tasks = p.tasks || [];
        function renderNode(node, depth) {
          const indent = 16 + depth * 16;
          const children = nodes.filter((n) => n.parentId === node.id);
          const isLeaf = node.type === 'Subassembly';
          const ntasks = tasks.filter((t) => t.nodeId === node.id);
          const blocked = ntasks.some((t) => t.status === 'Blocked');
          const done = ntasks.length && ntasks.every((t) => t.status === 'Completed');
          let h = `<div class="tn ${blocked ? 'blk' : ''}" style="padding-left:${indent}px;" onclick="void(0)">
      <span class="caret">${children.length || isLeaf ? '▼' : '▶'}</span>
      ${nodeBadge(node.type)}
      <span class="tn-lbl" style="font-weight:${node.type === 'Machine' ? 600 : 400};">${node.label}</span>
      ${done ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" fill="var(--grn-l)"/><path d="M4 7l2 2 4-4" stroke="var(--grn)" stroke-width="1.5" stroke-linecap="round"/></svg>` : ''}`;
          if (node.type !== 'Subassembly') {
            const ct = node.type === 'Machine' ? 'Module' : 'Subassembly';
            h += `<button class="add-c" onclick="event.stopPropagation();openNodeForm(${p.id},${node.id},'${ct}')">+ ${ct}</button>`;
          } else {
            h += `<button class="add-c" onclick="event.stopPropagation();openTaskForm(${p.id},${node.id})">+ Task</button>`;
          }
          h += `</div>`;
          if (isLeaf && ntasks.length) {
            ntasks.forEach((t) => {
              h += `<div class="tn ${t.status === 'Blocked' ? 'blk' : ''}" style="padding-left:${indent + 16}px;" onclick="openTaskEdit(${p.id},'${t.id}')">
          <span class="caret" style="opacity:0;width:12px;">·</span>
          ${taskBadge(t.status)}
          <span class="tn-lbl" style="font-size:12px;">${t.title}</span>
          ${t.owner ? av(t.owner, 'av-sm') : ''}
          ${t.due && new Date(t.due) < new Date() && t.status !== 'Completed' ? `<span style="font-size:10px;color:var(--red-t);">⚠</span>` : ''}
        </div>`;
            });
          }
          children.forEach((c) => (h += renderNode(c, depth + 1)));
          return h;
        }
        const roots = nodes.filter((n) => !n.parentId);
        if (!roots.length)
          return `<div class="empty" style="padding:40px 24px;">
    <div class="ei"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--blu)" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="8" width="8" height="8" rx="1.5"/><rect x="13" y="4" width="8" height="5" rx="1.5"/><rect x="13" y="14" width="8" height="5" rx="1.5"/></svg></div>
    <div class="et">Build your machine structure</div>
    <div class="es">Add the root Machine node, then Modules and Subassemblies. Tasks attach to Subassemblies.</div>
    <button class="eb" onclick="openNodeForm(${p.id},null,'Machine')">+ Add Machine</button>
  </div>`;
        let h = `<div style="background:var(--s);">`;
        roots.forEach((r) => (h += renderNode(r, 0)));
        h += `</div><div style="padding:12px 16px;"><button style="width:100%;padding:10px;border-radius:var(--rs);border:.5px solid var(--blu);background:var(--blu-l);color:var(--blu-t);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--ff);" onclick="openNodeForm(${p.id},null,'Machine')">+ Add Machine Node</button></div><div class="sp"></div>`;
        return h;
      }

      // PROJECT TASKS
      function renderPTasks(p) {
        const tasks = p.tasks || [];
        if (!tasks.length)
          return `<div class="empty" style="padding:40px 24px;">
    <div class="ei"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--blu)" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg></div>
    <div class="et">No tasks yet</div>
    <div class="es">Add tasks from the MBS Tree tab. Select a Subassembly and tap "+ Task".</div>
  </div>`;
        let h = `<div class="chips" id="ptchips">
    ${['All', 'Blocked', 'In Progress', 'Not Started', 'Completed'].map((f) => `<div class="chip ${f === 'All' ? 'on' : ''}" onclick="filterPT(this,'${f}',${p.id})">${f}</div>`).join('')}
  </div>
  <div style="padding:0 16px;display:flex;justify-content:flex-end;margin-bottom:6px;"><button style="font-size:12px;color:var(--blu);background:none;border:none;cursor:pointer;font-family:var(--ff);" onclick="openTaskForm(${p.id},null)">+ Add Task</button></div>
  <div class="card" style="margin:0 16px;" id="ptlist">`;
        tasks.forEach((t) => {
          const isBlocked = t.status === 'Blocked';
          const isOverdue = t.due && new Date(t.due) < new Date() && t.status !== 'Completed';
          h += taskRow(t, p.id, isBlocked, isOverdue);
        });
        h += `</div><div class="sp"></div>`;
        return h;
      }

      function taskRow(t, pid, isBlocked, isOverdue) {
        return `<div class="li" style="${isBlocked ? 'background:var(--red-l);' : isOverdue ? 'background:var(--amb-l);' : ''}" onclick="openTaskEdit(${pid},'${t.id}')">
    <div class="li-r">${taskBadge(t.status)}${prioBadge(t.priority || 'Medium')}</div>
    <div class="li-title" style="font-size:13px;">${t.title}</div>
    <div class="li-r">
      <span class="li-meta">${t.owner || 'Unassigned'} · ${t.dept || '—'}</span>
      <span class="li-meta mono" style="${isOverdue ? 'color:var(--red-t);' : ''}">${fmtDate(t.due) || 'No date'}${isOverdue ? ' ⚠' : ''}</span>
    </div>
  </div>`;
      }

      function filterPT(el, f, pid) {
        el.closest('.chips')
          .querySelectorAll('.chip')
          .forEach((c) => c.classList.remove('on'));
        el.classList.add('on');
        const p = S.projects.find((x) => x.id === pid);
        if (!p) return;
        const tasks = (p.tasks || []).filter((t) => f === 'All' || t.status === f);
        const list = document.getElementById('ptlist');
        if (!list) return;
        list.innerHTML = tasks.map((t) => taskRow(t, pid, t.status === 'Blocked', t.due && new Date(t.due) < new Date() && t.status !== 'Completed')).join('') || `<div class="li" style="cursor:default;text-align:center;"><div class="li-meta">No ${f.toLowerCase()} tasks.</div></div>`;
      }

      // PROJECT PROCUREMENT
      function renderPProc(p) {
        const items = p.procurement || [];
        const ll = items.filter((x) => x.leadWeeks >= 12 && x.status !== 'Ordered' && x.status !== 'Received');
        let h = '';
        if (ll.length) {
          h += `<div class="slbl"><span>LONG-LEAD RISK</span></div>`;
          ll.forEach((item) => {
            h += `<div class="alert alert-r" style="margin-bottom:8px;"><div class="alert-title">${item.title}</div><div class="alert-body">${item.supplier || '—'} · ×${item.qty || 1}</div><div style="display:flex;gap:6px;margin-top:8px;"><span class="ll">${item.leadWeeks} wks</span>${riskBadge(item.risk || 'High')}</div></div>`;
          });
        }
        if (!items.length) {
          h += emptyState('Procurement', 'No items yet', 'Track components, suppliers, and lead times. Flag long-lead items early.', '+ Add Item', `openProcForm(${p.id})`);
          return h;
        }
        h += `<div class="slbl"><span>ALL COMPONENTS</span></div><div class="card">`;
        items.forEach((item) => {
          h += `<div class="li" onclick="openProcEdit(${p.id},'${item.id}')">
      <div class="li-r"><div class="li-title" style="font-size:13px;">${item.title}</div>${item.leadWeeks >= 12 ? `<span class="ll">${item.leadWeeks}wk</span>` : ''}</div>
      <div class="li-r"><span class="li-meta">${item.supplier || '—'} · ×${item.qty || 1}</span>${procBadge(item.status || 'Not Ready')}</div>
      <div>${riskBadge(item.risk || 'Low')}</div>
    </div>`;
        });
        h += `</div><div style="padding:12px 16px;"><button style="width:100%;padding:10px;border-radius:var(--rs);border:.5px solid var(--blu);background:var(--blu-l);color:var(--blu-t);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--ff);" onclick="openProcForm(${p.id})">+ Add Component</button></div><div class="sp"></div>`;
        return h;
      }

      // PROJECT DECISIONS
      function renderPDecs(p) {
        const decs = p.decisions || [];
        if (!decs.length) return emptyState('Decisions', 'No decisions logged', 'Document key technical and commercial decisions with rationale for full traceability.', '+ Log Decision', `openDecForm(${p.id})`) + `<div class="sp"></div>`;
        let h = `<div class="slbl"><span>DECISION LOG</span></div><div class="card">`;
        decs.forEach((d) => {
          h += `<div class="li" style="cursor:default;">
      <div class="li-r">
        <div style="display:flex;align-items:center;gap:8px;">${av(d.by, 'av-sm')}<span class="li-sub" style="font-weight:500;">${d.by}</span></div>
        <span class="mono" style="color:var(--t3);">${fmtDate(d.date)}</span>
      </div>
      <div class="li-title" style="font-size:13px;margin-bottom:4px;">${d.title}</div>
      <div class="li-meta" style="line-height:1.55;">${d.rationale || ''}</div>
    </div>`;
        });
        h += `</div><div style="padding:12px 16px;"><button style="width:100%;padding:10px;border-radius:var(--rs);border:.5px solid var(--blu);background:var(--blu-l);color:var(--blu-t);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--ff);" onclick="openDecForm(${p.id})">+ Log Decision</button></div><div class="sp"></div>`;
        return h;
      }

      // ═══════════════════════════════════════════════
      //  ALL TASKS
      // ═══════════════════════════════════════════════
      function renderTasks() {
        const el = document.getElementById('R_tasks');
        const all = S.projects.flatMap((p) => (p.tasks || []).map((t) => ({ ...t, _proj: p })));
        if (!all.length) {
          el.innerHTML = emptyState('Tasks', 'No tasks yet', 'Tasks are created inside projects via the MBS Tree.', 'Go to Projects →', 'goView("projects")');
          return;
        }
        const f = UI.taskFilter || 'All';
        const filtered = f === 'All' ? all : all.filter((t) => t.status === f);
        let h = `<div class="chips">
    ${['All', 'Blocked', 'In Progress', 'Not Started', 'Completed'].map((ff) => `<div class="chip ${f === ff ? 'on' : ''}" onclick="setTF('${ff}')">${ff}</div>`).join('')}
  </div>
  <div style="padding:0 16px;font-size:11px;color:var(--t3);margin-bottom:8px;">${filtered.length} task${filtered.length !== 1 ? 's' : ''} · ${all.filter((t) => t.status === 'Blocked').length} blocked</div>`;
        if (filtered.length) {
          h += `<div class="card" style="margin:0 16px;">`;
          filtered.forEach((t) => {
            const isBlocked = t.status === 'Blocked';
            const isOverdue = t.due && new Date(t.due) < new Date() && t.status !== 'Completed';
            h += `<div class="li" style="${isBlocked ? 'background:var(--red-l);' : isOverdue ? 'background:var(--amb-l);' : ''}" onclick="openTaskEdit(${t._proj.id},'${t.id}')">
        <div class="li-r">${taskBadge(t.status)}${prioBadge(t.priority || 'Medium')}</div>
        <div class="li-title" style="font-size:13px;">${t.title}</div>
        <div class="li-r">
          <span class="li-meta">${t._proj.title} · ${t.owner || '—'}</span>
          <span class="li-meta mono" style="${isOverdue ? 'color:var(--red-t);' : ''}">${fmtDate(t.due) || '—'}${isOverdue ? ' ⚠' : ''}</span>
        </div>
      </div>`;
          });
          h += `</div>`;
        } else {
          h += `<div class="card" style="margin:0 16px;"><div class="li" style="cursor:default;text-align:center;"><div class="li-meta">No ${f.toLowerCase()} tasks.</div></div></div>`;
        }
        h += `<div class="sp"></div>`;
        el.innerHTML = h;
      }
      function setTF(f) {
        UI.taskFilter = f;
        renderTasks();
      }

      // ═══════════════════════════════════════════════
      //  PROCUREMENT DASHBOARD
      // ═══════════════════════════════════════════════
      function renderProc() {
        const el = document.getElementById('R_proc');
        const all = S.projects.flatMap((p) => (p.procurement || []).map((x) => ({ ...x, _proj: p })));
        const notReady = all.filter((x) => x.status === 'Not Ready');
        const pending = all.filter((x) => x.status === 'Pending Release');
        const ready = all.filter((x) => x.status === 'Ready');
        const ordered = all.filter((x) => x.status === 'Ordered');
        const ll = all.filter((x) => x.leadWeeks >= 12 && x.status !== 'Ordered' && x.status !== 'Received');

        let h = `<div class="kgrid">
    <div class="kpi"><div class="kpi-l">Not Ready</div><div class="kpi-v" style="color:var(--red-t)">${notReady.length}</div><div class="kpi-s">Designs unreleased</div></div>
    <div class="kpi"><div class="kpi-l">Pending Release</div><div class="kpi-v" style="color:var(--amb-t)">${pending.length}</div><div class="kpi-s">Awaiting sign-off</div></div>
    <div class="kpi"><div class="kpi-l">Ready to Order</div><div class="kpi-v" style="color:var(--grn-t)">${ready.length}</div><div class="kpi-s">Order now</div></div>
    <div class="kpi"><div class="kpi-l">Long-Lead Risk</div><div class="kpi-v" style="color:var(--cor-t)">${ll.length}</div><div class="kpi-s">≥12 wks unordered</div></div>
  </div>`;

        if (ll.length) {
          h += `<div class="slbl"><span>LONG-LEAD RISK</span></div>`;
          ll.forEach((item) => {
            h += `<div class="alert alert-r" style="margin-bottom:8px;">
        <div class="alert-title">${item.title}</div>
        <div class="alert-body">${item._proj.title} · ${item.supplier || '—'}</div>
        <div style="display:flex;gap:6px;margin-top:8px;"><span class="ll">${item.leadWeeks} wks</span>${riskBadge(item.risk || 'High')}${procBadge(item.status)}</div>
      </div>`;
          });
        }

        h += `<div class="slbl"><span>ALL ITEMS</span></div><div class="card" style="margin:0 16px;">`;
        if (!all.length) {
          h += `<div class="li" style="cursor:default;text-align:center;"><div class="li-meta">No procurement items yet. Add them inside a project.</div></div>`;
        }
        all.forEach((item) => {
          h += `<div class="li" onclick="openProj(${item._proj.id});setProjTab('procurement')">
      <div class="li-r"><div class="li-title" style="font-size:13px;">${item.title}</div>${item.leadWeeks >= 12 ? `<span class="ll">${item.leadWeeks}wk</span>` : ''}</div>
      <div class="li-r"><span class="li-meta">${item._proj.title} · ${item.supplier || '—'}</span>${procBadge(item.status || 'Not Ready')}</div>
    </div>`;
        });
        h += `</div><div class="sp"></div>`;
        el.innerHTML = h;
      }

      // ═══════════════════════════════════════════════
      //  SHEETS / FORMS
      // ═══════════════════════════════════════════════
      let _onSubmit = null;
      function openSheet(title, body, foot, onSubmit) {
        document.getElementById('SH_title').textContent = title;
        document.getElementById('SH_body').innerHTML = body;
        document.getElementById('SH_foot').innerHTML = foot || `<div class="btn-row"><button class="btn btn-s" onclick="closeSheet()">Cancel</button><button class="btn btn-p" onclick="_onSubmit&&_onSubmit()">Save</button></div>`;
        document.getElementById('SHEET').classList.add('on');
        document.getElementById('BACKDROP').classList.add('on');
        _onSubmit = onSubmit;
      }
      function closeSheet() {
        document.getElementById('SHEET').classList.remove('on');
        document.getElementById('BACKDROP').classList.remove('on');
        _onSubmit = null;
      }
      function fv(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
      }
      function sel(id, opts, cur) {
        return `<select id="${id}">${opts.map((o) => `<option ${o === cur ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
      }

      // OPP FORM
      function openOppForm() {
        openSheet(
          'New Machine Request',
          `<div class="field"><label class="fl">Request Title *</label><input id="f_ti" placeholder="e.g. High-Speed Labeling System MK3"></div>
   <div class="field"><label class="fl">Customer *</label><input id="f_cu" placeholder="e.g. BrewTech AG"></div>
   <div class="field"><label class="fl">Machine Type</label><input id="f_mt" placeholder="e.g. Labeling System"></div>
   <div class="field"><label class="fl">Number of Axes</label><input id="f_ax" type="number" min="1" placeholder="e.g. 6"></div>
   <div class="field"><label class="fl">Target Delivery</label><input id="f_de" placeholder="e.g. Q4 2025"></div>
   <div class="field"><label class="fl">Sales Representative</label><input id="f_cr" placeholder="Your name"></div>
   <div class="field"><label class="fl">Key Requirements</label><textarea id="f_req" placeholder="IP65, 600 bpm, EN-ISO 13849 PLd..."></textarea></div>`,
          null,
          () => {
            const ti = fv('f_ti'),
              cu = fv('f_cu');
            if (!ti || !cu) {
              alert('Title and customer required.');
              return;
            }
            S.opps.push({ id: S._oppId++, title: ti, customer: cu, machineType: fv('f_mt'), axes: fv('f_ax'), delivery: fv('f_de'), createdBy: fv('f_cr'), requirements: fv('f_req'), status: 'New', createdAt: new Date().toISOString().split('T')[0] });
            save();
            closeSheet();
            renderAll();
          },
        );
      }

      function openOppEdit(id) {
        const o = S.opps.find((x) => x.id === id);
        if (!o) return;
        openSheet(
          'Edit Opportunity',
          `<div class="field"><label class="fl">Title</label><input id="f_ti" value="${o.title}"></div>
   <div class="field"><label class="fl">Customer</label><input id="f_cu" value="${o.customer}"></div>
   <div class="field"><label class="fl">Machine Type</label><input id="f_mt" value="${o.machineType || ''}"></div>
   <div class="field"><label class="fl">Axes</label><input id="f_ax" type="number" value="${o.axes || ''}"></div>
   <div class="field"><label class="fl">Delivery</label><input id="f_de" value="${o.delivery || ''}"></div>
   <div class="field"><label class="fl">Status</label>${sel('f_st', OPP_ST, o.status)}</div>
   <div class="field"><label class="fl">Requirements</label><textarea id="f_req">${o.requirements || ''}</textarea></div>`,
          null,
          () => {
            o.title = fv('f_ti') || o.title;
            o.customer = fv('f_cu') || o.customer;
            o.machineType = fv('f_mt');
            o.axes = fv('f_ax');
            o.delivery = fv('f_de');
            o.status = fv('f_st') || o.status;
            o.requirements = fv('f_req');
            save();
            closeSheet();
            renderAll();
          },
        );
      }

      // CONVERT
      function openConvertForm(oid) {
        const o = S.opps.find((x) => x.id === oid);
        if (!o) return;
        openSheet(
          'Convert to Project',
          `<div class="info-box">Converting: <strong>${o.title}</strong></div>
   <div class="field"><label class="fl">Project Title *</label><input id="f_pt" value="${o.title}"></div>
   <div class="field"><label class="fl">Project Manager *</label><input id="f_pm" placeholder="PM name"></div>
   <div class="field"><label class="fl">Kickoff Date</label><input id="f_kd" type="date"></div>
   <div class="field"><label class="fl">Kickoff Notes / Scope Summary</label><textarea id="f_kn" placeholder="Attendees, scope confirmed, key risks, decisions made at kickoff..."></textarea></div>`,
          null,
          () => {
            const pt = fv('f_pt'),
              pm = fv('f_pm');
            if (!pt || !pm) {
              alert('Title and PM required.');
              return;
            }
            const p = {
              id: S._projId++,
              title: pt,
              customer: o.customer,
              machineType: o.machineType,
              axes: o.axes,
              delivery: o.delivery,
              pm,
              kickoffDate: fv('f_kd'),
              kickoffNotes: fv('f_kn'),
              stage: 'Intake',
              health: 'Healthy',
              oppId: o.id,
              nodes: [],
              tasks: [],
              procurement: [],
              decisions: [],
              milestones: [],
              createdAt: new Date().toISOString().split('T')[0],
            };
            S.projects.push(p);
            o.status = 'Converted';
            save();
            closeSheet();
            goView('projdet', { projId: p.id, tab: 'overview' });
          },
        );
      }

      // PROJECT EDIT
      function openProjEdit(pid) {
        const p = S.projects.find((x) => x.id === pid);
        if (!p) return;
        openSheet(
          'Edit Project',
          `<div class="field"><label class="fl">Title</label><input id="f_pt" value="${p.title}"></div>
   <div class="field"><label class="fl">Customer</label><input id="f_cu" value="${p.customer}"></div>
   <div class="field"><label class="fl">Project Manager</label><input id="f_pm" value="${p.pm || ''}"></div>
   <div class="field"><label class="fl">Delivery Target</label><input id="f_de" value="${p.delivery || ''}"></div>
   <div class="field"><label class="fl">Stage</label>${sel('f_st', STAGES, p.stage || 'Intake')}</div>
   <div class="field"><label class="fl">Kickoff Notes</label><textarea id="f_kn">${p.kickoffNotes || ''}</textarea></div>`,
          null,
          () => {
            p.title = fv('f_pt') || p.title;
            p.customer = fv('f_cu') || p.customer;
            p.pm = fv('f_pm');
            p.delivery = fv('f_de');
            p.stage = fv('f_st') || p.stage;
            p.kickoffNotes = fv('f_kn');
            save();
            closeSheet();
            renderAll();
          },
        );
      }

      // NODE FORM
      function openNodeForm(pid, parentId, type) {
        const p = S.projects.find((x) => x.id === pid);
        const parent = parentId ? (p.nodes || []).find((n) => n.id === parentId) : null;
        openSheet(
          `Add ${type}`,
          `${parent ? `<div class="info-box">Under: <strong>${parent.label}</strong></div>` : ''}
   <div class="field"><label class="fl">${type} Name *</label><input id="f_nl" placeholder="${type === 'Machine' ? 'e.g. BTL-MK3 Labeling Unit' : type === 'Module' ? 'e.g. Drive System' : 'e.g. Servo Drive Train'}"></div>
   <div style="font-size:12px;color:var(--t3);padding:8px 0;">${type === 'Subassembly' ? 'Tasks attach here.' : type === 'Module' ? 'Add Subassemblies inside.' : 'Top-level machine node.'}</div>`,
          null,
          () => {
            const label = fv('f_nl');
            if (!label) {
              alert('Name required.');
              return;
            }
            if (!p.nodes) p.nodes = [];
            p.nodes.push({ id: S._nodeId++, type, label, parentId: parentId || null });
            save();
            closeSheet();
            renderProjDet();
          },
        );
      }

      // TASK FORM
      function openTaskForm(pid, nodeId) {
        const p = S.projects.find((x) => x.id === pid);
        const node = nodeId ? (p.nodes || []).find((n) => n.id === nodeId) : null;
        openSheet(
          'Add Task',
          `${node ? `<div class="info-box">Subassembly: <strong>${node.label}</strong></div>` : ''}
   <div class="field"><label class="fl">Task Title *</label><input id="f_tt" placeholder="e.g. Servo sizing calculation"></div>
   <div class="field"><label class="fl">Owner</label><input id="f_ow" placeholder="Engineer name"></div>
   <div class="field"><label class="fl">Department</label>${sel('f_dp', [''].concat(DEPTS), '')}</div>
   <div class="field"><label class="fl">Priority</label>${sel('f_pr', PRIOS, 'Medium')}</div>
   <div class="field"><label class="fl">Due Date</label><input id="f_du" type="date"></div>
   <div class="field"><label class="fl">Status</label>${sel('f_st', TASK_ST, 'Not Started')}</div>`,
          null,
          () => {
            const title = fv('f_tt');
            if (!title) {
              alert('Title required.');
              return;
            }
            if (!p.tasks) p.tasks = [];
            p.tasks.push({ id: uid(), nodeId: nodeId || null, title, owner: fv('f_ow'), dept: fv('f_dp'), priority: fv('f_pr') || 'Medium', due: fv('f_du'), status: fv('f_st') || 'Not Started' });
            save();
            closeSheet();
            renderAll();
            if (UI.view === 'projdet') renderProjDet();
          },
        );
      }

      // TASK EDIT
      function openTaskEdit(pid, tid) {
        const p = S.projects.find((x) => x.id === pid);
        const t = (p.tasks || []).find((x) => x.id === tid);
        if (!t) return;
        openSheet(
          'Edit Task',
          `<div class="field"><label class="fl">Title</label><input id="f_tt" value="${t.title.replace(/"/g, '&quot;')}"></div>
   <div class="field"><label class="fl">Status</label>${sel('f_st', TASK_ST, t.status)}</div>
   <div class="field"><label class="fl">Priority</label>${sel('f_pr', PRIOS, t.priority || 'Medium')}</div>
   <div class="field"><label class="fl">Owner</label><input id="f_ow" value="${t.owner || ''}"></div>
   <div class="field"><label class="fl">Department</label>${sel('f_dp', [''].concat(DEPTS), t.dept || '')}</div>
   <div class="field"><label class="fl">Due Date</label><input id="f_du" type="date" value="${t.due || ''}"></div>`,
          `<div class="btn-row"><button class="btn btn-d" onclick="delTask(${pid},'${tid}')">Delete</button><button class="btn btn-s" onclick="closeSheet()">Cancel</button><button class="btn btn-p" onclick="_onSubmit&&_onSubmit()">Save</button></div>`,
          () => {
            t.title = fv('f_tt') || t.title;
            t.status = fv('f_st') || t.status;
            t.priority = fv('f_pr') || t.priority;
            t.owner = fv('f_ow');
            t.dept = fv('f_dp');
            t.due = fv('f_du');
            save();
            closeSheet();
            renderAll();
            if (UI.view === 'projdet') renderProjDet();
          },
        );
      }

      // PROCUREMENT FORM
      function openProcForm(pid) {
        openSheet(
          'Add Component',
          `<div class="field"><label class="fl">Component Name *</label><input id="f_pn" placeholder="e.g. Servo Drives IndraDrive Cs ×6"></div>
   <div class="field"><label class="fl">Supplier</label><input id="f_su" placeholder="e.g. Bosch Rexroth"></div>
   <div class="field"><label class="fl">Quantity</label><input id="f_qt" type="number" min="1" placeholder="1"></div>
   <div class="field"><label class="fl">Lead Time (weeks)</label><input id="f_lw" type="number" min="0" placeholder="e.g. 14"><div style="font-size:11px;color:var(--t3);margin-top:3px;">Items ≥12 weeks will be flagged as long-lead risk.</div></div>
   <div class="field"><label class="fl">Status</label>${sel('f_st', PROC_ST, 'Not Ready')}</div>
   <div class="field"><label class="fl">Risk Level</label>${sel('f_ri', RISKS, 'Medium')}</div>`,
          null,
          () => {
            const pn = fv('f_pn');
            if (!pn) {
              alert('Component name required.');
              return;
            }
            const p = S.projects.find((x) => x.id === pid);
            if (!p.procurement) p.procurement = [];
            p.procurement.push({ id: uid(), title: pn, supplier: fv('f_su'), qty: parseInt(fv('f_qt')) || 1, leadWeeks: parseInt(fv('f_lw')) || 0, status: fv('f_st') || 'Not Ready', risk: fv('f_ri') || 'Medium' });
            save();
            closeSheet();
            renderProjDet();
            renderProc();
          },
        );
      }

      function openProcEdit(pid, itemId) {
        const p = S.projects.find((x) => x.id === pid);
        const item = (p.procurement || []).find((x) => x.id === itemId);
        if (!item) return;
        openSheet(
          'Edit Component',
          `<div class="field"><label class="fl">Name</label><input id="f_pn" value="${item.title}"></div>
   <div class="field"><label class="fl">Supplier</label><input id="f_su" value="${item.supplier || ''}"></div>
   <div class="field"><label class="fl">Quantity</label><input id="f_qt" type="number" value="${item.qty || 1}"></div>
   <div class="field"><label class="fl">Lead Time (weeks)</label><input id="f_lw" type="number" value="${item.leadWeeks || 0}"></div>
   <div class="field"><label class="fl">Status</label>${sel('f_st', PROC_ST, item.status)}</div>
   <div class="field"><label class="fl">Risk</label>${sel('f_ri', RISKS, item.risk || 'Medium')}</div>`,
          `<div class="btn-row"><button class="btn btn-d" onclick="delProc(${pid},'${itemId}')">Delete</button><button class="btn btn-s" onclick="closeSheet()">Cancel</button><button class="btn btn-p" onclick="_onSubmit&&_onSubmit()">Save</button></div>`,
          () => {
            item.title = fv('f_pn') || item.title;
            item.supplier = fv('f_su');
            item.qty = parseInt(fv('f_qt')) || item.qty;
            item.leadWeeks = parseInt(fv('f_lw')) || 0;
            item.status = fv('f_st') || item.status;
            item.risk = fv('f_ri') || item.risk;
            save();
            closeSheet();
            renderProjDet();
            renderProc();
          },
        );
      }

      // DECISION FORM
      function openDecForm(pid) {
        const today = new Date().toISOString().split('T')[0];
        openSheet(
          'Log Decision',
          `<div class="field"><label class="fl">Decision *</label><input id="f_dt" placeholder="e.g. Servo platform: Bosch Rexroth IndraDrive Cs selected"></div>
   <div class="field"><label class="fl">Rationale</label><textarea id="f_dr" placeholder="Why was this decided? What alternatives were evaluated?"></textarea></div>
   <div class="field"><label class="fl">Decision By *</label><input id="f_db" placeholder="Name"></div>
   <div class="field"><label class="fl">Date</label><input id="f_dd" type="date" value="${today}"></div>`,
          null,
          () => {
            const dt = fv('f_dt'),
              db = fv('f_db');
            if (!dt || !db) {
              alert('Decision and name required.');
              return;
            }
            const p = S.projects.find((x) => x.id === pid);
            if (!p.decisions) p.decisions = [];
            p.decisions.unshift({ id: uid(), title: dt, rationale: fv('f_dr'), by: db, date: fv('f_dd') || today });
            save();
            closeSheet();
            renderProjDet();
          },
        );
      }

      // MILESTONE FORM
      function openMilestoneForm(pid) {
        openSheet(
          'Add Milestone',
          `<div class="field"><label class="fl">Milestone *</label><input id="f_mt" placeholder="e.g. Design Release, Build Start, FAT"></div>
   <div class="field"><label class="fl">Target Date</label><input id="f_md" type="date"></div>`,
          null,
          () => {
            const mt = fv('f_mt');
            if (!mt) {
              alert('Name required.');
              return;
            }
            const p = S.projects.find((x) => x.id === pid);
            if (!p.milestones) p.milestones = [];
            p.milestones.push({ id: uid(), title: mt, date: fv('f_md'), status: 'Pending' });
            save();
            closeSheet();
            renderProjDet();
          },
        );
      }

      // DELETES
      function delOpp(id) {
        if (!confirm('Delete this opportunity?')) return;
        S.opps = S.opps.filter((x) => x.id !== id);
        save();
        goView('opps');
      }
      function delProj(id) {
        if (!confirm('Delete project and all data?')) return;
        S.projects = S.projects.filter((x) => x.id !== id);
        save();
        goView('projects');
      }
      function delTask(pid, tid) {
        const p = S.projects.find((x) => x.id === pid);
        if (!p) return;
        p.tasks = (p.tasks || []).filter((t) => t.id !== tid);
        save();
        closeSheet();
        renderAll();
        if (UI.view === 'projdet') renderProjDet();
      }
      function delProc(pid, itemId) {
        const p = S.projects.find((x) => x.id === pid);
        if (!p) return;
        p.procurement = (p.procurement || []).filter((x) => x.id !== itemId);
        save();
        closeSheet();
        renderProjDet();
        renderProc();
      }

      // EMPTY STATE
      function emptyState(icon, title, sub, btnLabel, btnAction) {
        return `<div class="empty"><div class="ei"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--blu)" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg></div><div class="et">${title}</div><div class="es">${sub}</div><button class="eb" onclick="${btnAction}">${btnLabel}</button></div>`;
      }

      // ═══════════════════════════════════════════════
      //  RENDER ALL
      // ═══════════════════════════════════════════════
      function renderAll() {
        renderHeader();
        renderOverview();
        renderOpps();
        renderOppDet();
        renderProjects();
        renderProjDet();
        renderTasks();
        renderProc();
        updateTaskDot();
      }

      renderAll();
    </script>
  </body>
</html>
