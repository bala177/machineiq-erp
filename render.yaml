# ─── Render Blueprint for MachineIQ ERP ──────────────────────────
#
# Deployment profile: Customer #1 UAT
# Primary users: India
# Region: Singapore
#
# Architecture:
#   1. machineiq-postgres — PostgreSQL 16
#   2. machineiq-api      — NestJS backend
#   3. machineiq-web      — Next.js frontend
#
# API and PostgreSQL are intentionally deployed in the same region.
#
# Custom domains:
#   www.machineiq.tech
#   machineiq.tech
#
# PostgreSQL and the API use paid always-on compute for reliable UAT.
# The frontend uses free compute and may cold-start after inactivity.

databases:
  - name: machineiq-postgres
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: machineiq
    user: machineiq
    ipAllowList: []

services:
  # ─── Backend API ───────────────────────────────────────────────
  - type: web
    name: machineiq-api
    runtime: node
    repo: https://github.com/bala177/machineiq-erp.git
    plan: 0.5c-512mb
    region: singapore
    branch: main
    rootDir: backend

    # NODE_ENV=production normally skips devDependencies. NestJS CLI and
    # ts-node (used by TypeORM migrations) are required during deployment.
    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    preDeployCommand: npm run db:migration:run
    startCommand: npm run start:prod

    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      - key: DATABASE_URL
        fromDatabase:
          name: machineiq-postgres
          property: connectionString

      - key: DATABASE_SSL
        value: "false"

      - key: JWT_EXPIRATION
        value: 8h

      - key: CORS_ORIGIN
        value: https://www.machineiq.tech,https://machineiq.tech,https://machineiq-web.onrender.com

      - key: JWT_SECRET
        generateValue: true

  # ─── Frontend Web ──────────────────────────────────────────────
  - type: web
    name: machineiq-web
    runtime: node
    repo: https://github.com/bala177/machineiq-erp.git
    plan: free
    region: singapore
    branch: main
    rootDir: frontend

    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    startCommand: npm start

    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      - key: NEXT_PUBLIC_API_URL
        value: https://machineiq-api.onrender.com/api

      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://machineiq-api.onrender.com

    domains:
      - www.machineiq.tech
      - machineiq.tech
