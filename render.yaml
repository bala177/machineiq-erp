# ─── Render Blueprint for MachineIQ ERP ──────────────────────────
#
# Deployment profile: Customer #1 UAT
# Primary users: India
# Region: Singapore
#
# Architecture:
#   1. machineiq-postgres — PostgreSQL 16
#   2. machineiq-api      — NestJS backend
#   3. machineiq-web      — Next.js frontend
#
# API and PostgreSQL are intentionally deployed in the same region.
#
# Custom domains:
#   www.machineiq.tech
#   machineiq.tech
#
# PostgreSQL and the API use paid always-on compute for reliable UAT.
# The frontend uses free compute and may cold-start after inactivity.

databases:
  - name: machineiq-postgres
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: machineiq
    user: machineiq
    # External access is open so developers and the UAT team can connect
    # psql / IDE clients directly. The only thing guarding the database is
    # the generated `machineiq` password — rotate it in the Render dashboard
    # if it is ever pasted somewhere shared, and narrow this list to specific
    # office/home CIDRs once UAT connection patterns settle.
    ipAllowList:
      - source: 0.0.0.0/0
        description: open to all — password auth only

services:
  # ─── Backend API ───────────────────────────────────────────────
  - type: web
    name: machineiq-api
    runtime: node
    repo: https://github.com/bala177/machineiq-erp.git
    plan: 0.5c-512mb
    region: singapore
    branch: main
    rootDir: backend

    # NODE_ENV=production normally skips devDependencies. NestJS CLI and
    # ts-node (used by TypeORM migrations) are required during deployment.
    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    preDeployCommand: npm run db:migration:run
    startCommand: npm run start:prod

    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      - key: DATABASE_URL
        fromDatabase:
          name: machineiq-postgres
          property: connectionString

      - key: DATABASE_SSL
        value: "false"

      - key: JWT_EXPIRATION
        value: 8h

      # Customer UAT feedback collection. Set false after UAT to hide all
      # feedback routes and UI while retaining the submitted records.
      - key: FEEDBACK_ENABLED
        value: "true"

      - key: CORS_ORIGIN
        value: https://www.machineiq.tech,https://machineiq.tech,https://machineiq-web.onrender.com

      - key: JWT_SECRET
        generateValue: true

  # ─── Frontend Web ──────────────────────────────────────────────
  - type: web
    name: machineiq-web
    runtime: node
    repo: https://github.com/bala177/machineiq-erp.git
    plan: free
    region: singapore
    branch: main
    rootDir: frontend

    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    startCommand: npm start

    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      - key: NEXT_PUBLIC_API_URL
        value: https://machineiq-api.onrender.com/api

      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://machineiq-api.onrender.com

      # Inactivity sign-out: warn at 28 minutes idle, sign out at 30.
      - key: NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES
        value: "30"

      - key: NEXT_PUBLIC_IDLE_WARNING_SECONDS
        value: "120"

    domains:
      - www.machineiq.tech
      - machineiq.tech
